[build-system]
# The backend is pinned to the hash-locked version in requirements-build.lock
# (tests/test_packaging_metadata.py keeps the two in step).
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "permansson-application-successor-recovery"
version = "0.2.0"
description = "Permansson successor application: 26 bounded exact-rational finite profiles with independent checkers (numeric release scope, Linux CPython 3.12/3.13), source-bound Lean candidates for development, and native C10/C11 replay"
requires-python = ">=3.12,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["jsonschema==4.26.0", "referencing==0.37.0"]

[project.optional-dependencies]
# Kept as a compatibility alias for documented `[full-schema]` installs; the
# same pins are already mandatory dependencies, so it installs nothing extra.
full-schema = ["jsonschema==4.26.0", "referencing==0.37.0"]
semantics = ["rfc8785==0.1.4"]

[project.scripts]
permansson-app = "permansson_app.__main__:main"
permansson-governance = "permansson_app.governance_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
permansson_app = ["data/*.json", "data/schemas/*.json", "data/examples/*.json"]

name = "PermanssonLean"
version = "0.1.0"
defaultTargets = ["PermanssonLean"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[lean_lib]]
name = "PermanssonLean"

# Research proofs are a distinct, explicitly built library. The default target
# remains the original PermanssonLean formal core.
[[lean_lib]]
name = "PermanssonResearch"

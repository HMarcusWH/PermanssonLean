name: Research Lean

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Bind genuine required-check source
        shell: bash
        run: python -B -m verification.integrity.ci_context --repo . --event-file "$GITHUB_EVENT_PATH" --report "$RUNNER_TEMP/required-source.json"
      - name: Build research library and audit its transitive axioms
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: false
          build: true
          build-args: PermanssonResearch
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
          axiom-audit: true
          axiom-audit-root: PermanssonResearch
      # REVIEW PENDING: source IDs are supplied by an authorized administrator.
      # The actual original GitHub producer must be successful and reviewed.
      - name: Deliver genuine source-bound historical T and A2 artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ID: ${{ vars.PR113_HISTORICAL_PRODUCER_RUN_ID }}
          INDEPENDENT_REVIEW_ID: ${{ vars.PR113_SECURITY_REVIEW_ID }}
        run: |
          set -euo pipefail
          [[ "$ORIGINAL_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$INDEPENDENT_REVIEW_ID" =~ ^[1-9][0-9]*$ ]]
          python3 -B verification/research/pr113_historical_artifact_delivery.py \
            --producer-run-id "$ORIGINAL_RUN_ID" \
            --security-review-id "$INDEPENDENT_REVIEW_ID" \
            --out "$RUNNER_TEMP/pr113-historical-input"
          test -s "$RUNNER_TEMP/pr113-historical-input/historical_envelope.json"
          test -s "$RUNNER_TEMP/pr113-historical-input/historical_T.zip"
          test -s "$RUNNER_TEMP/pr113-historical-input/historical_A2.zip"
          echo "PERMANSSON_DUAL_HISTORICAL_EVIDENCE=$RUNNER_TEMP/pr113-historical-input/historical_envelope.json" >> "$GITHUB_ENV"
          echo "PERMANSSON_DUAL_ORIGINAL_T_ZIP=$RUNNER_TEMP/pr113-historical-input/historical_T.zip" >> "$GITHUB_ENV"
          echo "PERMANSSON_DUAL_ORIGINAL_A2_ZIP=$RUNNER_TEMP/pr113-historical-input/historical_A2.zip" >> "$GITHUB_ENV"
      - name: Run research-only exact rational regressions (CQ-1 and D0)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m unittest discover -s verification/research -p 'test_*.py' -v
      - name: Generate and independently verify C10 release proof evidence
        if: github.event_name == 'pull_request'
        run: |
          python3 verification/research/c10_release_evidence.py "$RUNNER_TEMP/c10-release-evidence" --event-file "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY"
          python3 verification/research/c10_verify_release_evidence.py "$RUNNER_TEMP/c10-release-evidence" --event-file "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY"
      - name: Upload source-bound C10 proof evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c10-release-evidence
          path: ${{ runner.temp }}/c10-release-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Generate and independently recheck D0-F golden reports
        run: python3 verification/research/d0_golden.py "$RUNNER_TEMP/d0-finite-certificates"
      - name: Upload ephemeral D0-F calculation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d0-finite-calculation-evidence
          path: ${{ runner.temp }}/d0-finite-certificates/
          retention-days: 7
          if-no-files-found: error
      - name: Verify original default target still builds
        run: lake build
      - name: Ensure every research module is imported by the research root
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("PermanssonResearch.lean")
          if not root.is_file():
              raise SystemExit("Missing research root module")
          imports = set()
          for line in root.read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if line.startswith("import "):
                  imports.update(line[7:].split())
          modules = sorted(Path("PermanssonResearch").rglob("*.lean"))
          if not modules:
              raise SystemExit("No research modules discovered")
          missing = [
              ".".join(p.with_suffix("").parts)
              for p in modules
              if ".".join(p.with_suffix("").parts) not in imports
          ]
          if missing:
              raise SystemExit(
                  "Research modules must be imported directly by the root: "
                  + ", ".join(missing)
              )
          print(f"Research import coverage PASS ({len(modules)} modules)")
          PY
      - name: Reject proof placeholders and custom axiom declarations
        run: |
          if grep -R -n --include='*.lean' -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*((private|protected|noncomputable|unsafe)[[:space:]]+)*axiom[[:space:]]' PermanssonResearch PermanssonResearch.lean; then
            echo 'Forbidden proof placeholder or custom axiom in research library'
            exit 1
          fi
          echo 'Research source firewall PASS'
      - name: Preserve required-check source context
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-research-source-context
          path: ${{ runner.temp }}/required-source.json
          if-no-files-found: error
          retention-days: 30

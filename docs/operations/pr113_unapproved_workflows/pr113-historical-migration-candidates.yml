# Review-pending source-controlled historical execution candidate.
# This workflow is NOT the required Research Lean or archive-reproducibility gate.
# It cannot approve a T2/A2 trust migration, PR merge, or mathematical release.
name: PR113 Historical T and A2 candidates

# Review/activation prerequisite: source-controlled branch push only.
# This file remains inactive outside .github/workflows until explicitly approved.
on:
  push:
    branches: [research/final-mathematical-closure]

permissions:
  contents: read

jobs:
  engineering-preflight:
    name: historical-engineering-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify real checkout and run existing 17-suite preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -B verification/research/pr113_fast_engineering_preflight.py \
            --head "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/pr113-fast-engineering"
      - name: Execute new producer and selection adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s verification/research -p test_pr113_prepare_positive_selection.py -v
          python3 -B -m unittest discover -s verification/research -p test_pr113_pack_ci_positive_owners.py -v
      - name: Resolve 45 genuine original case routes without acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -B verification/research/pr113_prepare_positive_selection.py --head "$GITHUB_SHA" --out "$RUNNER_TEMP/pr113-selection-smoke"
      - name: Retain candidate original-case route selection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr113-positive-selection-unreviewed
          path: ${{ runner.temp }}/pr113-selection-smoke/
          if-no-files-found: warn
          retention-days: 30
      - name: Retain unapproved exact-source QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr113-fast-qa-candidate
          path: ${{ runner.temp }}/pr113-fast-engineering/
          if-no-files-found: warn
          retention-days: 30

  original-T-and-current-H:
    name: historical-T-and-H-unreviewed
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Pin dependencies and isolate original history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -m pip install -r verification/integrity/requirements.txt
          git cat-file -e "71cc34fa0bc4b639c05d2ec5f39f0b88afd56388^{commit}"
          git worktree add --detach "$RUNNER_TEMP/pr113-source-T" \
            71cc34fa0bc4b639c05d2ec5f39f0b88afd56388
          test "$(git -C "$RUNNER_TEMP/pr113-source-T" rev-parse HEAD)" = \
            71cc34fa0bc4b639c05d2ec5f39f0b88afd56388
      - name: Execute unmodified T and current H as distinct historical legs
        shell: bash
        run: |
          set -euo pipefail
          python3 -B verification/research/pr113_dual_tooling_candidate.py \
            --historical-T-source "$RUNNER_TEMP/pr113-source-T" \
            --current-source "$GITHUB_WORKSPACE" \
            --head "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/pr113-dual-tooling"
      - name: Retain T and H original bytes and candidate reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr113-T-H-historical-candidate
          path: ${{ runner.temp }}/pr113-dual-tooling/
          if-no-files-found: warn
          retention-days: 30

  original-A2-and-current-H:
    name: historical-A2-and-H-unreviewed
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Pin genuine historical A2 executor source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git cat-file -e "f71a76032b169aac7bfe0694aa715339a94d4e05^{commit}"
          git worktree add --detach "$RUNNER_TEMP/pr113-source-A2" \
            f71a76032b169aac7bfe0694aa715339a94d4e05
          test "$(git -C "$RUNNER_TEMP/pr113-source-A2" rev-parse HEAD)" = \
            f71a76032b169aac7bfe0694aa715339a94d4e05
      - name: Build pinned Lean and audit current mathematical dependencies
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: false
          build: true
          build-args: PermanssonResearch
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
          axiom-audit: true
          axiom-audit-root: PermanssonResearch
      - name: Bind historical A2 to the exact pinned dependency source (not H build objects)
        shell: bash
        run: |
          set -euo pipefail
          OLD="$RUNNER_TEMP/pr113-source-A2"
          # Both real Git commits name identical toolchain/manifests. This
          # permits sharing only dependencies, never current-source proof .olean.
          for path in lean-toolchain lake-manifest.json lakefile.toml; do
            test "$(git rev-parse "$GITHUB_SHA:$path")" = \
              "$(git -C "$OLD" rev-parse "HEAD:$path")"
          done
          test -d "$GITHUB_WORKSPACE/.lake/packages"
          test ! -e "$OLD/.lake/packages"
          test ! -L "$OLD/.lake/packages"
          test ! -e "$OLD/.lake/build"
          mkdir -p "$OLD/.lake"
          ln -s "$GITHUB_WORKSPACE/.lake/packages" "$OLD/.lake/packages"
          # Prove every dependency is a clean Git checkout of the immutable
          # revision named by the unchanged manifest. No lake update, no
          # downloaded substitute mathlib, no imported current project build.
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          old = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pr113-source-A2"
          current = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          raw = (old/"lake-manifest.json").read_bytes()
          assert raw == (current/"lake-manifest.json").read_bytes()
          pins = json.loads(raw)
          assert pins["packagesDir"] == ".lake/packages"
          assert pins["packages"]
          assert (old/".lake/packages").resolve() == (current/".lake/packages").resolve()
          checked = {}
          for pkg in pins["packages"]:
              assert pkg.get("type") == "git"
              name, rev = pkg["name"], pkg["rev"]
              assert "/" not in name and len(rev) == 40
              root = old/".lake/packages"/name
              assert root.is_dir()
              actual = subprocess.check_output(
                  ["git", "-C", str(root), "rev-parse", "HEAD"], text=True).strip()
              assert actual == rev
              assert not subprocess.check_output(
                  ["git", "-C", str(root), "status", "--porcelain=v1",
                   "--untracked-files=all"])
              checked[name] = actual
          assert checked["mathlib"] == "5ed2965256430c3649e86755f9576b54eca72435"
          assert not (old/".lake/build").exists()
          receipt = {
              "format": "Permansson.PR113.HistoricalA2DependencyBridge.v1",
              "status": "PINNED_DEPENDENCIES_REUSED_WITHOUT_PROOF_BUILD_IMPORT",
              "historical_head": "f71a76032b169aac7bfe0694aa715339a94d4e05",
              "current_head": os.environ["GITHUB_SHA"],
              "manifest_sha256": hashlib.sha256(raw).hexdigest(),
              "pinned_packages": dict(sorted(checked.items())),
              "original_verifier_modified": False,
              "historical_project_proofs_reused": False,
              "independent_security_review": False,
              "mathematical_acceptance": False,
          }
          output = pathlib.Path(os.environ["RUNNER_TEMP"])/"pr113-A2-dependency-bridge.json"
          output.write_text(json.dumps(receipt, indent=2, sort_keys=True)+"\n")
          PY
      - name: Execute both genuine compiler gates and four semantic negatives
        shell: bash
        run: |
          set -euo pipefail
          python3 -B verification/research/pr113_dual_a2_compiler.py \
            --historical-source "$RUNNER_TEMP/pr113-source-A2" \
            --historical-head f71a76032b169aac7bfe0694aa715339a94d4e05 \
            --current-source "$GITHUB_WORKSPACE" \
            --current-head "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/pr113-dual-A2"
          # Carry forward the actual original dependency bridge bytes. The
          # output producer cannot claim full A2 provenance without them.
          test -s "$RUNNER_TEMP/pr113-A2-dependency-bridge.json"
          test -s "$RUNNER_TEMP/pr113-dual-A2/unreviewed_dual_A2_candidate.json"
          cp -- "$RUNNER_TEMP/pr113-A2-dependency-bridge.json" \
             "$RUNNER_TEMP/pr113-dual-A2/historical_dependency_bridge.json"
      - name: Retain historical and successor source-bound proof logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr113-A2-historical-candidate
          path: ${{ runner.temp }}/pr113-dual-A2/
          if-no-files-found: warn
          retention-days: 30

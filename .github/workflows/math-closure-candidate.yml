name: Mathematical closure draft PDF
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research_papers/mathematical_closure/**'
      - 'release/mathematical-closure-1/**'
      - 'verification/research/test_final_release_manifest.py'
      - '.github/workflows/math-closure-candidate.yml'
permissions:
  contents: read
jobs:
  manuscript-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install TeX and PDF preview tools (draft only)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-extra texlive-fonts-recommended texlive-pictures \
            texlive-bibtex-extra poppler-utils
          pdflatex --version | head -1
      - name: Audit historical accepted cases without promoting pending claims
        run: python3 verification/research/final_closure_verify.py --mode audit
      - name: Compile and verify real source-bound PDF draft
        run: |
          python3 release/mathematical-closure-1/build.py \
            --mode draft --render --out "$RUNNER_TEMP/math-closure-draft"
          python3 release/mathematical-closure-1/verify_release.py \
            --manifest "$RUNNER_TEMP/math-closure-draft/manifest.lock.json"
      - name: Upload draft artifact, never publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unaccepted-math-closure-draft
          path: ${{ runner.temp }}/math-closure-draft/
          retention-days: 14

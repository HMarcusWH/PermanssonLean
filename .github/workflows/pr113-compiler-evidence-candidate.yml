name: PR113 Compiler Evidence Candidate

on:
  push:
    branches:
      - research/final-mathematical-closure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build exact source and audit transitive axioms
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: false
          build: true
          build-args: PermanssonResearch
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
          axiom-audit: true
          axiom-audit-root: PermanssonResearch
      - name: Execute all 11 mapped compiler-declaration probes
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/research/final_closure_lean_evidence.py \
            --head "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/perm-compiler-candidate"
      - name: Bind evidence to actual source/job/run/attempt
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/research/final_closure_execution_stamp.py \
            --head "$GITHUB_SHA" \
            --evidence-dir "$RUNNER_TEMP/perm-compiler-candidate" \
            --out "$RUNNER_TEMP/perm-compiler-candidate/execution_provenance.json"
      - name: Retain raw executed compiler logs and unreviewed inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr113-executed-compiler-candidate
          path: ${{ runner.temp }}/perm-compiler-candidate/
          retention-days: 30
          if-no-files-found: error

name: PR113 One-Time Research-Branch Actions Backlog Cleanup

on:
  push:
    branches:
      - research/final-mathematical-closure
    paths:
      - .github/workflows/pr113-cancel-backlog-once.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: pr113-one-time-actions-backlog-cleanup
  cancel-in-progress: false

jobs:
  cancel-research-branch-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Request cancellation only for active PR113 branch runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_THIS_RUN: ${{ github.run_id }}
          GH_BRANCH: research/final-mathematical-closure
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          token = os.environ['GH_TOKEN']
          repo = os.environ['GH_REPOSITORY']
          branch = os.environ['GH_BRANCH']
          current = int(os.environ['GH_THIS_RUN'])
          assert repo == 'HMarcusWH/PermanssonLean', 'Repository mismatch'
          assert branch == 'research/final-mathematical-closure', 'Branch mismatch'
          base = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'Permansson-PR113-Backlog-Cleanup',
          }

          def api(method, path):
              for attempt in range(5):
                  try:
                      req = Request(base + path, headers=headers, method=method)
                      with urlopen(req, timeout=35) as response:
                          data = response.read()
                          return response.status, json.loads(data) if data else {}
                  except HTTPError as exc:
                      if method == 'POST' and exc.code in (409, 422):
                          return exc.code, {}
                      if exc.code in (403, 429, 500, 502, 503) and attempt < 4:
                          delay = min(40, float(exc.headers.get('Retry-After') or 4) + 3 * attempt)
                          time.sleep(delay)
                          continue
                      raise
              raise RuntimeError('GitHub API retry budget exhausted')

          active_states = ('queued', 'in_progress', 'waiting', 'requested', 'pending')
          candidates = {}
          for state in active_states:
              for page in range(1, 16):
                  args = urlencode({'branch': branch, 'status': state,
                                    'per_page': 100, 'page': page})
                  status, response = api('GET', '/actions/runs?' + args)
                  runs = response.get('workflow_runs', [])
                  if not isinstance(runs, list):
                      raise RuntimeError('Malformed GitHub Actions response')
                  for run in runs:
                      if (run.get('head_branch') == branch and
                          run.get('status') in active_states and
                          run.get('id') != current and
                          run.get('event') in ('push', 'pull_request', 'workflow_dispatch')):
                          candidates[run['id']] = run
                  if len(runs) < 100:
                      break
              else:
                  raise RuntimeError('Backlog too large for bounded pagination')

          if len(candidates) > 1500:
              raise RuntimeError('Unexpected cancellation candidate count')

          print(f'Identified {len(candidates)} active PR113-branch runs to cancel', flush=True)
          accepted = []
          already_finished = []
          errors = []
          for run_id in sorted(candidates):
              try:
                  status, _ = api('POST', f'/actions/runs/{run_id}/cancel')
                  if status == 202:
                      accepted.append(run_id)
                  elif status in (409, 422):
                      already_finished.append(run_id)
                  else:
                      errors.append({'id': run_id, 'status': status})
              except Exception as exc:
                  errors.append({'id': run_id, 'error': str(exc)[:200]})
              time.sleep(0.25)

          report = {
              'scope': f'{repo}:{branch}',
              'self_run_excluded': current,
              'identified': len(candidates),
              'cancel_requests_accepted': len(accepted),
              'no_longer_cancellable': len(already_finished),
              'errors': errors[:100],
              'note': 'HTTP 202 means cancellation requested, not yet completed',
          }
          output = os.path.join(os.environ['RUNNER_TEMP'], 'pr113-backlog-cancel-report.json')
          with open(output, 'w', encoding='utf-8') as f:
              json.dump(report, f, indent=2, sort_keys=True)
          print(json.dumps(report, indent=2), flush=True)
          if errors:
              sys.exit(1)
          PY
      - name: Retain cancellation request report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr113-cancel-backlog-report
          path: ${{ runner.temp }}/pr113-backlog-cancel-report.json
          retention-days: 7
          if-no-files-found: warn

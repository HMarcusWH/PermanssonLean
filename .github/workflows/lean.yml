name: Lean

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: leanprover/lean-action@v1.6.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
          axiom-audit: true
          axiom-audit-root: PermanssonLean
      - name: Build
        run: lake build
      - name: Reject placeholders and extra axioms
        run: |
          if grep -R -n -E '\b(sorry|admit)\b|^[[:space:]]*axiom[[:space:]]' PermanssonLean --include='*.lean'; then
            echo 'Forbidden placeholder or axiom detected'
            exit 1
          fi

name: Lean

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Bind genuine required-check source
        shell: bash
        run: python -B -m verification.integrity.ci_context --repo . --event-file "$GITHUB_EVENT_PATH" --report "$RUNNER_TEMP/required-source.json"
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
          axiom-audit: true
          axiom-audit-root: PermanssonLean
      - name: Build
        run: lake build
      - name: Reject placeholders and extra axioms
        run: |
          if grep -R -n -E '\b(sorry|admit)\b|^[[:space:]]*axiom[[:space:]]' PermanssonLean --include='*.lean'; then
            echo 'Forbidden placeholder or axiom detected'
            exit 1
          fi
      - name: Preserve required-check source context
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-build-source-context
          path: ${{ runner.temp }}/required-source.json
          if-no-files-found: error
          retention-days: 30

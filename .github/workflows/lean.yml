name: Lean

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
          axiom-audit: true
          axiom-audit-root: PermanssonLean
      - name: Build
        run: lake build
      - name: Reject placeholders and extra axioms
        run: |
          if grep -R -n -E '\b(sorry|admit)\b|^[[:space:]]*axiom[[:space:]]' PermanssonLean --include='*.lean'; then
            echo 'Forbidden placeholder or axiom detected'
            exit 1
          fi

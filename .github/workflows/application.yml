name: Application contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application-contract:
    name: Application contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: application/requirements.txt
      - name: Bind genuine required-check source
        shell: bash
        run: python -B -m verification.integrity.ci_context --repo . --event-file "$GITHUB_EVENT_PATH" --report "$RUNNER_TEMP/required-source.json"
      - name: Install application-only dependencies
        run: python -m pip install -r application/requirements.txt
      - name: Positive, negative and boundary tests
        run: python -m unittest discover -s application/tests -v
      - name: Verify committed example regeneration
        run: python application/examples/build_examples.py
      - name: Application repository synchronization gate
        run: python verification/application_gate.py
      - name: Preserve required-check source context
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-application-source-context-${{ matrix.os }}
          path: ${{ runner.temp }}/required-source.json
          if-no-files-found: error
          retention-days: 30

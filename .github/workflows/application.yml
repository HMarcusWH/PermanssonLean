name: Application contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-contract:
    name: Application contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: application/requirements.txt
      - name: Install application-only dependencies
        run: python -m pip install -r application/requirements.txt
      - name: Positive, negative and boundary tests
        run: python -m unittest discover -s application/tests -v
      - name: Verify committed example regeneration
        run: python application/examples/build_examples.py
      - name: Application repository synchronization gate
        run: python verification/application_gate.py

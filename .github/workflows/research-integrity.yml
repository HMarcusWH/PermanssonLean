name: Research integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frozen-source-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Bind actual source context
        run: python -B -m verification.integrity.ci_context --repo . --event-file "$GITHUB_EVENT_PATH" --report "$RUNNER_TEMP/context.json"
      - name: Verify every protected Git object
        run: python -B -m verification.integrity.preservation --repo . --candidate "$GITHUB_SHA" --report "$RUNNER_TEMP/preservation.json"
      - name: Execute reference and preservation adversaries
        run: |
          python -B -m verification.integrity.run_tests --suite reference --report "$RUNNER_TEMP/reference-tests.json"
          python -B -m verification.integrity.run_tests --suite preservation --report "$RUNNER_TEMP/preservation-tests.json"
          python -B -m verification.integrity.run_tests --suite context --report "$RUNNER_TEMP/context-tests.json"
          python -B -m verification.integrity.run_tests --suite workflow --report "$RUNNER_TEMP/workflow-tests.json"
      - name: Preserve source and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hardening-preservation-reports
          path: |
            ${{ runner.temp }}/context.json
            ${{ runner.temp }}/preservation.json
            ${{ runner.temp }}/*-tests.json
          if-no-files-found: error
          retention-days: 30
  release-export-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Bind actual source context
        run: python -B -m verification.integrity.ci_context --repo . --event-file "$GITHUB_EVENT_PATH" --report "$RUNNER_TEMP/context.json"
      - name: Compare the complete isolated TeX export
        run: python -B -m verification.integrity.tex_export --repo . --candidate "$GITHUB_SHA" --report "$RUNNER_TEMP/tex-export.json"
      - name: Execute independent equation and import-isolation adversaries
        run: python -B -m verification.integrity.run_tests --suite tex --report "$RUNNER_TEMP/tex-tests.json"
      - name: Preserve export and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hardening-export-reports
          path: |
            ${{ runner.temp }}/context.json
            ${{ runner.temp }}/tex-export.json
            ${{ runner.temp }}/tex-tests.json
          if-no-files-found: error
          retention-days: 30
  archive-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Bind actual source context
        run: python -B -m verification.integrity.ci_context --repo . --event-file "$GITHUB_EVENT_PATH" --report "$RUNNER_TEMP/context.json"
      - name: Prepare the pinned replay dependency before isolation
        run: python -m pip install -r verification/integrity/requirements.txt
      - name: Execute archive adversaries
        run: python -B -m verification.integrity.run_tests --suite archive --report "$RUNNER_TEMP/archive-tests.json"
      - name: Restore the actual historical bundle without network access
        run: python -B -m verification.archive.offline_smoke --repo . --candidate "$GITHUB_SHA" --supplement archival/v0.2.0/supplement-1 --scratch "$RUNNER_TEMP/archive-clean" --report "$RUNNER_TEMP/archive-replay.json"
      - name: Preserve archival restoration reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hardening-archive-reports
          path: |
            ${{ runner.temp }}/context.json
            ${{ runner.temp }}/archive-tests.json
            ${{ runner.temp }}/archive-replay.json
          if-no-files-found: error
          retention-days: 30

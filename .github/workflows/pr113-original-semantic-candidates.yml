name: PR113 Original Semantic Mutant Candidates

on:
  push:
    branches:
      - research/final-mathematical-closure
    paths:
      - '.github/workflows/pr113-original-semantic-candidates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-semantic-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build and audit pinned research source
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: false
          build: true
          build-args: PermanssonResearch
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
          axiom-audit: true
          axiom-audit-root: PermanssonResearch
      - name: Execute frozen original semantic-positive and false mutations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = "HMarcusWH/PermanssonLean"
          case "${{ matrix.shard }}" in
            0) CASES=(F-03 D-02 D-03) ;;
            1) CASES=(D-04 D-05 D-06) ;;
            2) CASES=(Q-03 Q-04 E-05) ;;
            *) exit 2 ;;
          esac
          mkdir -p "$RUNNER_TEMP/original-semantic-candidates"
          for CASE in "${CASES[@]}"; do
            python3 verification/research/final_closure_original_semantic_batch.py \
              --head "$GITHUB_SHA" --case-id "$CASE" \
              --out "$RUNNER_TEMP/original-semantic-candidates/$CASE"
          done
      - name: Bind retained candidate to real job execution without approval
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          assert source == os.environ["GITHUB_SHA"]
          assert os.environ["GITHUB_REPOSITORY"] == "HMarcusWH/PermanssonLean"
          out = Path(os.environ["RUNNER_TEMP"]) / "original-semantic-candidates"
          cases = sorted(p.name for p in out.iterdir() if p.is_dir())
          assert len(cases) == 3
          for case in cases:
              data = json.loads((out/case/"unreviewed_candidate.json").read_text())
              assert data["status"] == "DETACHED_UNREVIEWED_UNATTRIBUTED"
              assert data["source_head"] == source and data["case_id"] == case
              assert data["ci_check_run_id"] is None
              assert data["independent_review"] is False
          record = {
              "format": "Permansson.CIOriginalSemanticCandidateRun.v1",
              "status": "EXECUTED_UNREVIEWED_NOT_AUTHENTICATED_RECEIPT",
              "source_head": source,
              "source_tree": tree,
              "github_repository": os.environ["GITHUB_REPOSITORY"],
              "github_workflow": os.environ["GITHUB_WORKFLOW"],
              "github_job": os.environ["GITHUB_JOB"],
              "github_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "github_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "case_ids": cases,
              "independent_review": False,
              "check_run_id": None,
              "release_approved": False
          }
          (out/"execution_identity.json").write_text(
              json.dumps(record, sort_keys=True, indent=2)+"\n")
          PY
      - name: Retain detached original source and mutant logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr113-original-semantic-candidates-${{ matrix.shard }}
          path: ${{ runner.temp }}/original-semantic-candidates/
          retention-days: 30
          if-no-files-found: error

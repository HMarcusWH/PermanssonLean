name: B2 sequential smoke

on:
  push:
    branches:
      - research/b2-sequential-conditional-margins
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b2-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile real four-corner proofs and destructive witnesses
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: PermanssonResearch.GrammarRobust.SequentialAdversaries
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: B2 exact rational destructive tests
        run: python3 -m unittest discover -s verification/research -p 'test_lane_b2_sequential_effects.py' -v

  b2-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Independent B2 model execution and exact arithmetic
        run: python3 -m unittest discover -s verification/research -p 'test_lane_b2_sequential_effects.py' -v

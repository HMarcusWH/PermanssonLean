name: Executable verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  executable-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: verification/destructive/suite/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r verification/destructive/suite/requirements.txt

      - name: Install PDF and TeX verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-extra \
            texlive-pictures

      - name: Destructive/regression suite (Runs 17-30)
        run: python verification/destructive/suite/run_all.py

      - name: Editorial-final release gate (Run 34)
        run: python verification/v0.1.8_release_gate/run34_editorial_final_release_gate.py

      - name: Repository synchronization gate
        run: python verification/repository_gate.py

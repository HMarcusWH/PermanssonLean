name: Executable verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  executable-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: verification/destructive/suite/requirements.txt

      - name: Bind genuine required-check source
        shell: bash
        run: python -B -m verification.integrity.ci_context --repo . --event-file "$GITHUB_EVENT_PATH" --report "$RUNNER_TEMP/required-source.json"

      - name: Install Python dependencies
        run: python -m pip install -r verification/destructive/suite/requirements.txt

      - name: Run destructive/regression suite (Runs 17-30)
        run: python verification/destructive/suite/run_all.py

      - name: Repository synchronization gate
        run: python verification/repository_gate.py

      - name: Syntax-check preserved release gates
        run: |
          python -m py_compile verification/v0.1.8_release_gate/run34_editorial_final_release_gate.py
          python -m py_compile verification/v0.1.8_release_gate/prior_gates_31_33/run31_release_gate.py
          python -m py_compile verification/v0.1.8_release_gate/prior_gates_31_33/run32_figure_correction_gate.py
          python -m py_compile verification/v0.1.8_release_gate/prior_gates_31_33/run33_final_figure3_layout_gate.py
      - name: Preserve required-check source context
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-executable-source-context
          path: ${{ runner.temp }}/required-source.json
          if-no-files-found: error
          retention-days: 30

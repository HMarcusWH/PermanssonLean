name: PR113 All Original Semantic Candidate Evidence

on:
  push:
    branches:
      - research/final-mathematical-closure
    paths:
      - '.github/workflows/pr113-all-original-semantic-candidates.yml'
      - 'PermanssonResearch/**'
      - 'PermanssonResearch.lean'
      - 'verification/research/final_closure_*'
      - 'verification/research/test_pr113_semantic_*.py'
      - 'verification/research/test_final_closure_all_original_semantics.py'
      - 'research/paper_closures/post_merge_112/acceptance_case_source_map.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-candidate-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Check exact Git checkout before mathematical work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = "HMarcusWH/PermanssonLean"
          test -z "$(git status --porcelain=v1 --untracked-files=all -- PermanssonResearch PermanssonLean verification/research)"
      - name: Build pinned Lean research tree and audit axioms
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: false
          build: true
          build-args: PermanssonResearch
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
          axiom-audit: true
          axiom-audit-root: PermanssonResearch
      - name: Run exact source/mutant candidates (not approval)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 verification/research/final_closure_all_original_semantics.py \
            --head "$GITHUB_SHA" \
            --shard-index "${{ matrix.shard }}" --shard-count 9 \
            --out "$RUNNER_TEMP/pr113-semantic-source-${{ matrix.shard }}"
      - name: Preserve unreviewed source/mutant compiler evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr113-all-original-semantic-candidates-${{ matrix.shard }}
          path: ${{ runner.temp }}/pr113-semantic-source-${{ matrix.shard }}/
          retention-days: 30
          if-no-files-found: error
